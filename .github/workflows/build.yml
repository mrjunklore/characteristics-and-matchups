name: Sync characteristics_and_matchups.json

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fetch JSON
        run: curl -f -sS "$WORKER_URL" -o characteristics_and_matchups.new.json
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
      
      - name: Commit if changed
        run: |
          jq 'del(.meta.generated_at)' characteristics_and_matchups.json > old.normalized.json
          jq 'del(.meta.generated_at)' characteristics_and_matchups.new.json > new.normalized.json
      
          if cmp -s old.normalized.json new.normalized.json; then
            echo "No meaningful changes"
            rm characteristics_and_matchups.new.json old.normalized.json new.normalized.json
          else
            mv characteristics_and_matchups.new.json characteristics_and_matchups.json
            git add characteristics_and_matchups.json
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git commit -m "auto: sync from worker"
            git push
          fi
